name: Скан пампов/дампов -> Telegram

on:
  schedule:
    # каждые 15 минут — отдельно и чаще, чем часовой свинг-тренд монитор
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan-pumps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pump scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pump_monitor.py

      - name: Commit updated state
        run: |
          git config user.name "swing-trend-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pump_state.json
          git diff --quiet --cached || git commit -m "Обновление состояния скана пампов/дампов"
          git pull --rebase origin HEAD
          git push

