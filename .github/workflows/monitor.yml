name: Свинг-тренд мониторинг -> Telegram

on:
  schedule:
    # каждый час в 5 минут после часа (запас, чтобы 1H-свеча на OKX точно закрылась)
    - cron: "5 * * * *"
  workflow_dispatch: {}   # позволяет запустить вручную кнопкой Run workflow

permissions:
  contents: write   # нужно, чтобы коммитить обновлённый state.json обратно в репозиторий

jobs:
  check-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Commit updated state
        run: |
          git config user.name "swing-trend-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state_eth.json state_btc.json
          git diff --quiet --cached || git commit -m "Обновление состояния мониторинга"
          # если в репозитории появился более новый коммит (например, ты в это же
          # время правил файлы на github.com), подтягиваем его перед пушем, чтобы
          # не словить "non-fast-forward" ошибку
          git pull --rebase origin HEAD
          git push
